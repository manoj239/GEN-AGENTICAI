name: Python CD Pipeline

on:
  workflow_run:
    workflows: ["Python CI Pipeline"]
    types:
      - completed
jobs:
  cd:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      # 1. Download Artifact from CI Pipeline
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: python-artifact
          path: dist

      # 2. Verify Artifact
      - name: Verify Artifact
        run: |
          echo "Artifacts Found:"
          ls -l dist

      # 3. Install Twine
      - name: Install Twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      # 4. Upload Artifact to Nexus
      - name: Upload To Nexus
        run: |
          twine upload \
          --repository-url ${{ secrets.NEXUS_URL }}/repository/pypi-hosted/ \
          -u ${{ secrets.NEXUS_USERNAME }} \
          -p ${{ secrets.NEXUS_PASSWORD }} \
          dist/*

      # 5. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t genai-rag-app:${{ github.run_number }} .

      # 6. Tag Docker Image
      - name: Tag Docker Image
        run: |
          docker tag \
          genai-rag-app:${{ github.run_number }} \
          ${{ secrets.DOCKER_USERNAME }}/genai-rag-app:${{ github.run_number }}

      # 7. Login To Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 8. Push Docker Image
      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/genai-rag-app:${{ github.run_number }}